name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: npm test
      - name: Pack extension zip
        run: |
          npm run pack
          cp dist/tricast-danmaku-mv3.zip "dist/tricast-danmaku-${{ github.ref_name }}-mv3.zip"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/tricast-danmaku-mv3.zip
            dist/tricast-danmaku-${{ github.ref_name }}-mv3.zip
