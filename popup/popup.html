<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>TriCast 三端融合弹幕</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <div class="brand">
      <img src="../icons/icon-32.png" width="24" height="24" alt="">
      <div>
        <strong>TriCast 三端融合弹幕</strong>
        <small id="tabStatus">检测状态中…</small>
      </div>
    </div>
    <div class="power-wrap" title="一键开启或关闭插件（关闭后停止拉流并完全隐藏播放器内 UI）">
      <span id="powerLabel" class="power-label">已开启</span>
      <label class="switch">
        <input id="extensionEnabled" type="checkbox" checked>
        <span></span>
      </label>
    </div>
  </header>

  <section id="updateBanner" class="update-banner" hidden>
    <div class="update-info">
      <strong id="updateBannerTitle">✨ 发现新版本</strong>
      <small id="updateBannerDesc">点击前往 GitHub 下载最新压缩包覆盖更新</small>
    </div>
    <div class="update-actions">
      <button id="updateOpenBtn" type="button" class="primary">去下载 ↗</button>
      <button id="updateDismissBtn" type="button">忽略</button>
    </div>
  </section>

  <div id="mainControls">
    <section class="rooms-box">
      <div class="rooms-head">
        <span>融合直播间配置</span>
        <div class="status-pills">
          <span id="pillBili" class="pill" data-plat="bilibili" data-state="idle">B站</span>
          <span id="pillKick" class="pill" data-plat="kick" data-state="idle">Kick</span>
          <span id="pillDouyin" class="pill" data-plat="douyin" data-state="idle">抖音</span>
        </div>
      </div>

      <div class="room-line">
        <label><input id="roomEnBili" type="checkbox" checked>B站</label>
        <input id="roomValBili" type="text" placeholder="房间号或 live.bilibili.com/...">
      </div>
      <div class="room-line">
        <label><input id="roomEnKick" type="checkbox" checked>Kick</label>
        <input id="roomValKick" type="text" placeholder="频道名或 kick.com/...">
      </div>
      <div class="room-line">
        <label><input id="roomEnDouyin" type="checkbox" checked>抖音</label>
        <input id="roomValDouyin" type="text" placeholder="房间号 / live.douyin.com / follow/live 链接">
      </div>
      <div class="room-actions">
        <button id="saveRoomsBtn" type="button" class="primary">保存并重连</button>
        <button id="openRoomsPanelBtn" type="button">预设管理</button>
      </div>
    </section>

    <section class="grid">
      <div class="ctrl">
        <label for="danmakuTransparency">透明度 <output id="danmakuTransparencyVal">15%</output></label>
        <input id="danmakuTransparency" type="range" min="0" max="95" step="1" value="15">
      </div>
      <div class="ctrl">
        <label for="danmakuSize">字号 <output id="danmakuSizeVal">22 px</output></label>
        <input id="danmakuSize" type="range" min="14" max="64" step="1" value="22">
      </div>
      <div class="ctrl">
        <label for="danmakuSpeed">速度 <output id="danmakuSpeedVal">1.0×</output></label>
        <input id="danmakuSpeed" type="range" min="0.4" max="2.5" step="0.1" value="1">
      </div>
      <div class="ctrl">
        <label for="danmakuMaxCount">同屏上限 <output id="danmakuMaxCountVal">80 条</output></label>
        <input id="danmakuMaxCount" type="range" min="20" max="310" step="10" value="80">
      </div>
    </section>

    <div class="toggles">
      <label><input id="showChat" type="checkbox" checked>开启飘屏弹幕</label>
      <label><input id="showControlBar" type="checkbox" checked>显示右下角设置条</label>
      <label><input id="showSuperChat" type="checkbox" checked>显示 B站 SC 醒目留言</label>
      <label><input id="showChatFeed" type="checkbox">三端聊天窗 (Alt+L)</label>
      <label><input id="showPlatformBadge" type="checkbox" checked>来源角标 (B/K/抖)</label>
      <label><input id="allowOverlap" type="checkbox">满轨允许叠层</label>
      <label><input id="suppressNativeBili" type="checkbox" checked>隐藏网页原弹幕(B/抖)</label>
      <label><input id="mergeRepeated" type="checkbox" checked>8 秒刷屏合并</label>
      <label class="span-2"><input id="mergeTextOnly" type="checkbox" checked>仅合并纯文字（表情 / GIF 不合并）</label>
    </div>

    <footer class="actions">
      <button id="openPlayerPanel" type="button" class="primary">播放器内完整设置</button>
      <button id="resetBtn" type="button">重置</button>
    </footer>
  </div>

  <p class="hint"><code>Alt+D</code> 弹幕 · <code>Alt+B</code> 设置条 · <code>Alt+L</code> 聊天窗 · <code>Alt+C</code> 发送 · <code>Alt+S</code> 设置</p>
  <div class="ver-bar">
    <span id="versionLabel">v1.2.3</span>
    <span id="updateCheckStatus" class="ver-status"></span>
    <button id="checkUpdateBtn" type="button" class="link-btn">检查更新</button>
  </div>

  <script src="../src/shared/state.js"></script>
  <script src="popup.js"></script>
</body>
</html>
